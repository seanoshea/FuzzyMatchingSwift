name: CI

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
    branches: [ develop, master, main ]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint.yml

  build-and-test:
    name: Build and Test
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - platform=iOS Simulator,OS=18.2,name=iPhone 16 Pro Max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd Example
          bundle exec pod install

      - name: Run tests
        run: |
          xcodebuild \
            -workspace ./Example/FuzzyMatchingSwift.xcworkspace \
            -scheme FuzzyMatchingSwift-Example \
            -destination "${{ matrix.destination }}" \
            ONLY_ACTIVE_ARCH=YES \
            GCC_INSTRUMENT_PROGRAM_FLOW_ARCS=YES \
            GCC_GENERATE_TEST_COVERAGE_FILES=YES \
            -enableCodeCoverage YES \
            clean test | xcpretty

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/*.xcresult
            junit.xml
          retention-days: 7

  build-platforms:
    name: Build All Platforms
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - scheme: FuzzyMatchingSwift-iOS
            destination: generic/platform=iOS
          - scheme: FuzzyMatchingSwift-macOS
            destination: platform=macOS
          - scheme: FuzzyMatchingSwift-watchOS
            destination: generic/platform=watchOS
          - scheme: FuzzyMatchingSwift-tvOS
            destination: platform=tvOS Simulator,name=Apple TV

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd Example
          bundle exec pod install

      - name: Build ${{ matrix.scheme }}
        run: |
          xcodebuild \
            -workspace ./Example/FuzzyMatchingSwift.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty

  pod-lint:
    name: Pod Lib Lint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Run pod lib lint
        run: bundle exec pod lib lint --quick

name: CI

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
    branches: [ develop, master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint.yml

  build-ios:
    name: Build iOS Framework
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install xcpretty
          cd Example
          bundle exec pod install

      - name: Build iOS Framework
        run: |
          set -o pipefail && xcodebuild \
            -workspace ./Example/FuzzyMatchingSwift.xcworkspace \
            -scheme FuzzyMatchingSwift-iOS \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty

  build-macos:
    name: Build macOS Framework
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install xcpretty
          cd Example
          bundle exec pod install

      - name: Build macOS Framework
        run: |
          set -o pipefail && xcodebuild \
            -workspace ./Example/FuzzyMatchingSwift.xcworkspace \
            -scheme FuzzyMatchingSwift-macOS \
            -destination "platform=macOS" \
            clean build | xcpretty

  build-watchos:
    name: Build watchOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install xcpretty
          cd Example
          bundle exec pod install

      - name: Build watchOS
        run: |
          set -o pipefail && xcodebuild \
            -workspace ./Example/FuzzyMatchingSwift.xcworkspace \
            -scheme FuzzyMatchingSwift-watchOS \
            -destination "generic/platform=watchOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty

  build-tvos:
    name: Build tvOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install xcpretty
          cd Example
          bundle exec pod install

      - name: Build tvOS
        run: |
          set -o pipefail && xcodebuild \
            -workspace ./Example/FuzzyMatchingSwift.xcworkspace \
            -scheme FuzzyMatchingSwift-tvOS \
            -destination "generic/platform=tvOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty

  spm-build:
    name: Build with SPM
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Swift Package Manager
        run: swift build

      - name: Test with Swift Package Manager
        run: swift test

  pod-lint:
    name: Pod Lib Lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Run pod lib lint
        run: bundle exec pod lib lint --quick
